# ============================================================
#  config.properties  \u2013  Runtime configuration
#  testautomationpractice.blogspot.com Selenium Project
# ============================================================

# Target URL
base.url=https://testautomationpractice.blogspot.com

# Browser: chrome | firefox | edge
browser=chrome

# Headless mode (true for CI, false for local visual run)
headless=false

# Timeouts in seconds
implicit.wait=10
explicit.wait=20
page.load.timeout=30

# Failure screenshots
screenshot.on.failure=true
screenshot.dir=screenshots/

# HTML report folder
report.dir=reports/

# ---------- Test Data ----------
test.name=John Doe
test.email=johndoe@testmail.com
test.phone=9876543210
